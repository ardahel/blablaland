<!DOCTYPE html>
<html>
<head>
    <title>Blablaland Prototype</title>
    <style>
        body {
            margin: 0;
            background: url('https://i.imgur.com/SJ4R9Sj.png') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        #topbar {
            position: absolute;
            top: 10px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .topButtonImg {
            width: 120px;
            cursor: pointer;
        }
        #formContainer {
            display: none;
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        #formContainer input {
            display: block;
            margin: 10px auto;
            padding: 5px;
            width: 200px;
        }
        #container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #000;
            display: block;
            width: 960px;
            height: 540px;
            border: 10px solid white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        #interface {
            width: 960px;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .section {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
            width: 30%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #chatMessages {
            height: 140px;
            overflow-y: auto;
            background: rgba(0,0,0,0.1);
            padding: 5px;
            text-align: left;
            font-size: 12px;
            margin-bottom: 5px;
        }
        #chatInput {
            width: 90%;
            padding: 5px;
            margin-bottom: 5px;
        }
        #inventory {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            justify-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            margin-top: 5px;
        }
        .inventory-slot {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div id="topbar">
    <img src="https://i.imgur.com/P8ChU6A.png" class="topButtonImg" data-type="Connexion" onclick="showForm('Connexion')">
    <img src="https://i.imgur.com/i0AGXLh.png" class="topButtonImg" data-type="Inscription" onclick="showForm('Inscription')">
</div>

<div id="formContainer">
    <h3 id="formTitle">Connexion</h3>
    <input type="text" id="formUsername" placeholder="Pseudo">
    <input type="password" id="formPassword" placeholder="Mot de passe">
    <button id="formSubmit">Valider</button>
    <button onclick="hideForm()">Fermer</button>
</div>

<div id="container">
    <canvas id="game" width="960" height="540"></canvas>
</div>

<div id="ui">
    <p>Argent: <span id="money">0</span> 💰</p>
</div>

<div id="interface">
    <div class="section">
        <div id="chatMessages"></div>
        <input type="text" id="chatInput" placeholder="Ecrire un message...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
    <div class="section">
        <p>Inventaire</p>
        <div id="inventory"></div>
    </div>
    <div class="section">
        <p>Info Joueur</p>
        <p>Pseudo: <span id="playerPseudo">Non connecté</span></p>
        <p>Argent: <span id="playerMoney">0</span> 💰</p>
        <p>LVL: <span id="playerLevel">1</span></p>
    </div>
</div>

<!-- SOCKET.IO + CLIENT.JS -->
<script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<script src="client.js"></script>
</body>
</html>
