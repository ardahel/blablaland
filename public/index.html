<!DOCTYPE html>
<html>
<head>
    <title>Blablaland - Jeu Multijoueur</title>
    <style>
        body {
            margin: 0;
            background: url('https://i.imgur.com/SJ4R9Sj.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            font-family: sans-serif;
        }
        #topbar {
            position: absolute;
            top: 10px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .topButtonImg {
            width: 120px;
            cursor: pointer;
        }
        #formContainer {
            display: none;
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #formContainer input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 250px;
        }
        #formContainer button {
            padding: 5px 20px;
        }
        #container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #000;
            display: block;
            width: 960px;
            height: 540px;
            border: 10px solid white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        #interface {
            width: 960px;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .section {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
            width: 30%;
            text-align: center;
        }
        #chatMessages {
            height: 140px;
            overflow-y: auto;
            background: rgba(0,0,0,0.1);
            padding: 5px;
            text-align: left;
            font-size: 12px;
            margin-bottom: 5px;
        }
        #chatInput {
            width: 90%;
            padding: 5px;
        }
        #inventory {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            justify-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            margin-top: 5px;
        }
        .inventory-slot {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

<!-- TOPBAR buttons -->
<div id="topbar">
    <img src="https://i.imgur.com/P8ChU6A.png" class="topButtonImg" id="loginButton">
    <img src="https://i.imgur.com/i0AGXLh.png" class="topButtonImg" id="registerButton">
</div>

<!-- Formulaire de Connexion / Inscription -->
<div id="formContainer">
    <h3 id="formTitle">Connexion</h3>
    <input type="text" id="formPseudo" placeholder="Pseudo">
    <input type="password" id="formPassword" placeholder="Mot de passe">
    <button id="formSend">Valider</button>
    <button onclick="hideForm()">Fermer</button>
</div>

<!-- Canvas de jeu -->
<div id="container">
    <canvas id="game" width="960" height="540"></canvas>
</div>

<!-- Argent global -->
<div id="ui">
    <p>Argent: <span id="money">0</span> 💰</p>
</div>

<!-- Interface bas -->
<div id="interface">
    <div class="section">
        <div id="chatMessages"></div>
        <input type="text" id="chatInput" placeholder="Ecrire un message...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
    <div class="section">
        <p>Inventaire</p>
        <div id="inventory"></div>
    </div>
    <div class="section">
        <p>Info Joueur</p>
        <p>Pseudo: <span id="playerPseudo">Non connecté</span></p>
        <p>Argent: <span id="playerMoney">0</span> 💰</p>
        <p>LVL: <span id="playerLevel">1</span></p>
    </div>
</div>

<script>
function showForm(type) {
    const form = document.getElementById('formContainer');
    form.style.display = 'block';
    document.getElementById('formTitle').innerText = type;
    form.setAttribute("data-type", type);
}

function hideForm() {
    document.getElementById('formContainer').style.display = 'none';
}

// Form validation (Connexion / Inscription)
document.getElementById("formSend").addEventListener("click", () => {
    const type = document.getElementById('formContainer').getAttribute("data-type");
    const pseudo = document.getElementById("formPseudo").value;
    const password = document.getElementById("formPassword").value;

    if (type === "Connexion") login(pseudo, password);
    if (type === "Inscription") register(pseudo, password);

    hideForm();
});
</script>

<!-- SOCKET.IO + Client.js -->
<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
